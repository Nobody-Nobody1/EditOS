name: Build OS

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust nightly
      run: |
        rustup toolchain install nightly --component rust-src --component llvm-tools-preview --target x86_64-unknown-none
        rustup default nightly

    - name: Install bootimage
      run: cargo install bootimage

    - name: Build kernel image
      run: cargo +nightly bootimage
      working-directory: ./EditOS

    - name: Upload bootimage artifact
      uses: actions/upload-artifact@v4
      with:
        name: edit-os-image
        path: target/x86_64-unknown-none/debug/bootimage.bin